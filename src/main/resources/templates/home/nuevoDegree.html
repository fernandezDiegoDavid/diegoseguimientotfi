<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Degree</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
	
	

    <!-- Contenido principal -->
    <main class="flex-fill">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">

                    <div class="card shadow-lg rounded-3">
                        <div class="card-body">
                            <h3 class="card-title mb-4 text-center">Agregar Degree</h3>

                            <form th:action="@{/newdegree}" th:object="${degree}" method="post">
                                
                                <!-- Name -->
                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" th:field="*{name}" class="form-control" placeholder="Nombre del Degree">
                                </div>

                                <!-- Institucion -->
                                <div class="mb-3">
                                    <label class="form-label">Institución</label>
                                    <input type="text" th:field="*{institucion}" class="form-control" placeholder="Nombre de la institución">
                                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('institucion')}" th:errors="*{institucion}"></div>
                                </div>

                                <!-- Year -->
                                <div class="mb-3">
                                    <label class="form-label">Year</label>
                                    <input type="text" th:field="*{year}" class="form-control" placeholder="Año de finalización">
                                    <div class="text-danger mt-1" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></div>
                                </div>

                                <!-- Botón -->
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Guardar</button>
                                </div>
                            </form>

                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-5 bg-dark mt-auto">
        <div class="container">
            <p class="m-0 text-center text-white">© UNLa 2025 - Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
