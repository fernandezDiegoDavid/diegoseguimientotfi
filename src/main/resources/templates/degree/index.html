<!DOCTYPE html>
<!--
Vista índice de Degrees.
Muestra un listado y permite crear un nuevo registro desde el mismo formulario.
-->
<html xmlns:th="http://www.thymeleaf.org">
 <!--
 xmlns:th habilita el uso de atributos Thymeleaf (th:text, th:each, th:field, etc.).
 -->


<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Degree List</title>
	<!-- Bootstrap local del proyecto -->
	<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
	<link href="/css/modern-business.css" rel="stylesheet" />
</head>

<body class="bg-light">
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-12 col-xl-10">
				<div class="card shadow-sm mb-4">
					<div class="card-body p-4">
						<h1 class="h4 mb-4">Listado de degrees</h1>

						<!--
						Tabla de resultados:
						th:each recorre la colección "degrees" enviada por el controlador.
						th:text imprime cada propiedad del objeto degree.
						-->
						<div class="table-responsive">
							<table class="table table-striped table-bordered mb-0">
								<thead class="thead-light">
									<tr>
										<th>Name</th>
										<th>Institution</th>
										<th>Year</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="degree : ${degrees}">
										<td><span th:text="${degree.name}"></span></td>
										<td><span th:text="${degree.institution}"></span></td>
										<td><span th:text="${degree.year}"></span></td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>

				<div class="card shadow-sm">
					<div class="card-body p-4">
						<h2 class="h4 mb-4">Agregar Degree</h2>

						<!--
						Formulario de alta rápida:
						th:action="@{/degrees}": endpoint POST del controlador de Degree.
						th:object="${degree}": objeto base del binding del formulario.
						th:field="*{...}": enlaza cada input con una propiedad del DTO.
						-->
						<form action="#" th:action="@{/degrees}" th:object="${degree}" method="post">

							<div class="form-group">
								<label for="name">Nombre</label>
								<input id="name" type="text" class="form-control" th:field="*{name}"
									placeholder="Ingrese nombre" />
							</div>

							<div class="form-group">
								<label for="institucion">Institucion</label>
								<input id="institucion" type="text" class="form-control" th:field="*{institucion}"
									placeholder="Ingrese institucion" />
							</div>

							<div class="form-group">
								<label for="year">Año</label>
								<input id="year" type="text" class="form-control" th:field="*{year}"
									placeholder="Ingrese año" />
							</div>

							<button type="submit" class="btn btn-primary btn-block">Crear</button>
							<a class="btn btn-link btn-block mt-2" th:href="@{/index}">Volver al home</a>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

<script src="/vendor/jquery/jquery.min.js"></script>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
